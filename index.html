<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ALLAM - AI Alarm & Community</title>

  <!-- React 18 & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Babel Standalone CDN -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Firebase Compat v10 SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #0f0c1b;
      --bg-card: rgba(26, 22, 48, 0.75);
      --bg-card-border: rgba(139, 92, 246, 0.25);
      --primary-purple: #8b5cf6;
      --primary-hover: #7c3aed;
      --accent-glow: rgba(139, 92, 246, 0.4);
    }

    * {
      box-sizing: border-box;
      font-family: 'Noto Sans KR', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(88, 28, 135, 0.35) 0%, transparent 40%),
        radial-gradient(circle at 85% 75%, rgba(124, 58, 237, 0.25) 0%, transparent 40%);
      background-attachment: fixed;
      color: #f3f4f6;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow-x: hidden;
    }

    #root {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
      background: rgba(15, 12, 27, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .glass-card {
      background: var(--bg-card);
      border: 1px solid var(--bg-card-border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 1.25rem;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .glass-card-interactive {
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .glass-card-interactive:active {
      transform: scale(0.98);
      border-color: rgba(167, 139, 250, 0.6);
    }

    .glass-nav {
      background: rgba(18, 14, 36, 0.88);
      border-top: 1px solid rgba(139, 92, 246, 0.2);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .purple-glow {
      box-shadow: 0 0 20px var(--accent-glow);
    }

    .purple-text-glow {
      text-shadow: 0 0 12px rgba(167, 139, 250, 0.6);
    }

    ::-webkit-scrollbar {
      width: 5px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 12, 27, 0.5);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(139, 92, 246, 0.4);
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(139, 92, 246, 0.7);
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.8; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.03); }
    }

    .animate-pulse-glow {
      animation: pulseGlow 3s infinite ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .animate-fade-in {
      animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes skeletonPulse {
      0%, 100% { background-color: rgba(255, 255, 255, 0.05); }
      50% { background-color: rgba(139, 92, 246, 0.15); }
    }

    .skeleton {
      animation: skeletonPulse 1.5s infinite ease-in-out;
      border-radius: 0.5rem;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    // --- Lucide Icon Wrapper ---
    const Icon = ({ name, size = 20, className = "" }) => {
      const iconRef = useRef(null);

      useEffect(() => {
        if (iconRef.current && window.lucide) {
          iconRef.current.innerHTML = `<i data-lucide="${name}" class="w-${Math.round(size/4)} h-${Math.round(size/4)} ${className}"></i>`;
          window.lucide.createIcons({
            attrs: { strokeWidth: 2 },
            nameAttr: 'data-lucide'
          });
        }
      }, [name, size, className]);

      return <span ref={iconRef} className="inline-flex items-center justify-center shrink-0" />;
    };

    // --- Web Speech API (TTS Player) ---
    const speakText = (text, onEndCallback) => {
      if (!('speechSynthesis' in window)) {
        if (onEndCallback) onEndCallback();
        return;
      }

      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'ko-KR';
      utterance.rate = 1.0;
      utterance.pitch = 1.0;

      if (onEndCallback) {
        utterance.onend = onEndCallback;
        utterance.onerror = onEndCallback;
      }

      window.speechSynthesis.speak(utterance);
    };

    const stopSpeech = () => {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
    };

    // --- Toast Component ---
    const Toast = ({ message, type = "info", onClose }) => {
      useEffect(() => {
        const timer = setTimeout(() => {
          onClose();
        }, 3000);
        return () => clearTimeout(timer);
      }, [onClose]);

      const bgColors = {
        info: "bg-purple-900/90 border-purple-500/50 text-purple-100",
        success: "bg-emerald-900/90 border-emerald-500/50 text-emerald-100",
        error: "bg-rose-900/90 border-rose-500/50 text-rose-100",
        warning: "bg-amber-900/90 border-amber-500/50 text-amber-100"
      };

      return (
        <div className={`fixed top-5 left-1/2 -translate-x-1/2 z-50 w-[90%] max-w-[420px] p-4 rounded-xl border backdrop-blur-md shadow-2xl flex items-center justify-between animate-fade-in ${bgColors[type] || bgColors.info}`}>
          <div className="flex items-center gap-3">
            <Icon name={type === 'success' ? 'check-circle' : type === 'error' ? 'alert-circle' : 'info'} size={20} />
            <span className="text-sm font-medium leading-relaxed">{message}</span>
          </div>
          <button onClick={onClose} className="p-1 opacity-70 hover:opacity-100 transition-opacity">
            <Icon name="x" size={16} />
          </button>
        </div>
      );
    };

    // --- Skeleton Loader ---
    const SkeletonCard = () => (
      <div className="glass-card p-5 space-y-4 w-full">
        <div className="flex items-center space-y-2 justify-between">
          <div className="h-4 bg-purple-900/40 w-1/3 skeleton"></div>
          <div className="h-6 bg-purple-900/40 w-12 skeleton rounded-full"></div>
        </div>
        <div className="h-10 bg-purple-900/40 w-full skeleton"></div>
        <div className="h-4 bg-purple-900/40 w-2/3 skeleton"></div>
      </div>
    );

    // --- Firebase Init ---
    const firebaseConfig = {
      apiKey: "AIzaSyDEMO_KEY_ALLAM_FIREBASE",
      authDomain: "allam-ai-alarm.firebaseapp.com",
      projectId: "allam-ai-alarm",
      storageBucket: "allam-ai-alarm.appspot.com",
      messagingSenderId: "123456789012",
      appId: "1:123456789012:web:demo123456789"
    };

    if (!firebase.apps.length) {
      try {
        firebase.initializeApp(firebaseConfig);
      } catch (err) {
        console.warn("Firebase 데모 모드로 작동합니다:", err);
      }
    }

    const auth = firebase.auth();
    const db = firebase.firestore();

    // --- Header ---
    const Header = ({ userStats }) => (
      <header className="sticky top-0 z-40 px-5 py-4 glass-nav flex items-center justify-between border-b border-purple-500/10">
        <div className="flex items-center gap-2">
          <div className="w-8 h-8 rounded-xl bg-gradient-to-tr from-purple-600 to-indigo-500 flex items-center justify-center shadow-lg shadow-purple-500/30">
            <Icon name="bell-ring" size={18} className="text-white" />
          </div>
          <span className="font-black text-xl tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-purple-300 via-purple-100 to-indigo-200">
            ALLAM
          </span>
        </div>
        <div className="flex items-center gap-3">
          <div className="flex items-center gap-1.5 bg-purple-950/60 border border-purple-500/30 px-3 py-1 rounded-full">
            <Icon name="coins" size={14} className="text-amber-400" />
            <span className="text-xs font-bold text-amber-300">{userStats.currency.toLocaleString()} G</span>
          </div>
          <div className="flex items-center gap-1 bg-purple-900/40 border border-purple-500/20 px-2.5 py-1 rounded-full text-xs font-semibold text-purple-200">
            <span>Lv.{userStats.level}</span>
          </div>
        </div>
      </header>
    );

    // --- Bottom Navigation ---
    const BottomNav = ({ activeTab, setActiveTab }) => {
      const navItems = [
        { id: 'home', label: 'Home', icon: 'home' },
        { id: 'community', label: 'Community', icon: 'users' },
        { id: 'morning', label: 'Morning', icon: 'sun' },
        { id: 'shop', label: 'Shop', icon: 'shopping-bag' },
        { id: 'profile', label: 'Profile', icon: 'user' },
      ];

      return (
        <nav className="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[480px] z-40 glass-nav px-2 py-2">
          <div className="flex justify-around items-center">
            {navItems.map((item) => {
              const isActive = activeTab === item.id;
              return (
                <button
                  key={item.id}
                  onClick={() => setActiveTab(item.id)}
                  className={`flex flex-col items-center justify-center w-16 py-1.5 rounded-xl transition-all duration-300 relative ${
                    isActive 
                      ? 'text-purple-300 font-bold scale-105' 
                      : 'text-gray-400 hover:text-purple-200 opacity-70'
                  }`}
                >
                  {isActive && (
                    <div className="absolute -top-2 w-8 h-1 bg-purple-500 rounded-full shadow-[0_0_8px_#8b5cf6]"></div>
                  )}
                  <Icon name={item.icon} size={20} className={isActive ? 'text-purple-400' : ''} />
                  <span className="text-[10px] mt-1 tracking-tight">{item.label}</span>
                </button>
              );
            })}
          </div>
        </nav>
      );
    };

    // --- Home Tab ---
    const HomeTab = ({ userStats, onNavigateMorning, showToast }) => {
      const [isPlayingQuote, setIsPlayingQuote] = useState(false);
      const quoteText = "오늘 당신의 아침은 단순한 시작이 아니라, 목표에 한 걸음 더 다가가는 일년 중 가장 소중한 1분입니다.";

      const handlePlayQuote = () => {
        if (isPlayingQuote) {
          stopSpeech();
          setIsPlayingQuote(false);
        } else {
          setIsPlayingQuote(true);
          speakText(quoteText, () => setIsPlayingQuote(false));
        }
      };

      const expPercentage = Math.min(100, Math.round((userStats.exp / userStats.maxExp) * 100));

      return (
        <div className="p-5 space-y-6 pb-28 animate-fade-in">
          <div className="glass-card p-6 border-purple-500/30 relative overflow-hidden bg-gradient-to-br from-purple-900/40 via-purple-950/30 to-indigo-950/40">
            <div className="absolute -right-6 -bottom-6 w-32 h-32 bg-purple-500/10 rounded-full blur-2xl pointer-events-none"></div>
            <div className="flex justify-between items-start mb-4">
              <div>
                <span className="text-xs font-semibold text-purple-300 tracking-wider uppercase">다음 기상 시간</span>
                <h2 className="text-4xl font-extrabold text-white mt-1 tracking-tight font-mono">
                  {userStats.nextWakeTime || "07:00 AM"}
                </h2>
              </div>
              <span className="bg-purple-500/20 text-purple-300 text-xs px-3 py-1 rounded-full border border-purple-500/30 font-medium">
                D-Day
              </span>
            </div>
            
            <p className="text-xs text-gray-300 mb-5 flex items-center gap-1.5">
              <Icon name="target" size={14} className="text-purple-400" />
              오늘의 기상 목표: <span className="text-purple-200 font-semibold">{userStats.morningReason || "성공적인 하루를 위한 일찍 일어나기"}</span>
            </p>

            <button
              onClick={onNavigateMorning}
              className="w-full py-3.5 px-4 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-bold text-sm rounded-xl transition-all shadow-lg shadow-purple-600/30 flex items-center justify-center gap-2 active:scale-[0.98]"
            >
              <Icon name="sparkles" size={18} />
              AI 모닝콜 설정 & 생성하기
            </button>
          </div>

          <div className="grid grid-cols-2 gap-4">
            <div className="glass-card p-4 flex flex-col justify-between">
              <div className="flex items-center justify-between text-amber-400 mb-2">
                <span className="text-xs font-semibold text-gray-300">연속 기상 스트릭</span>
                <Icon name="flame" size={20} />
              </div>
              <div>
                <span className="text-3xl font-black text-amber-400 font-mono">{userStats.streak}</span>
                <span className="text-xs text-gray-400 ml-1">일째 달성 중</span>
              </div>
            </div>

            <div className="glass-card p-4 flex flex-col justify-between">
              <div className="flex items-center justify-between text-purple-400 mb-2">
                <span className="text-xs font-semibold text-gray-300">현재 성장 레벨</span>
                <Icon name="award" size={20} />
              </div>
              <div>
                <div className="flex items-baseline gap-1">
                  <span className="text-2xl font-black text-purple-200">Lv.{userStats.level}</span>
                  <span className="text-[10px] text-purple-400">({expPercentage}%)</span>
                </div>
                <div className="w-full bg-purple-950 rounded-full h-2 mt-2 border border-purple-500/20 overflow-hidden">
                  <div 
                    className="bg-gradient-to-r from-purple-500 to-indigo-400 h-full rounded-full transition-all duration-500"
                    style={{ width: `${expPercentage}%` }}
                  ></div>
                </div>
              </div>
            </div>
          </div>

          <div className="glass-card p-5 space-y-3">
            <div className="flex items-center justify-between border-b border-purple-500/20 pb-3">
              <h3 className="font-bold text-sm text-purple-200 flex items-center gap-2">
                <Icon name="check-square" size={16} className="text-purple-400" />
                오늘의 모닝 미션
              </h3>
              <span className="text-xs text-purple-400 font-semibold">+50 EXP / +100 G</span>
            </div>

            <div className="space-y-2">
              {userStats.missions.map((mission) => (
                <div 
                  key={mission.id}
                  onClick={() => showToast(mission.completed ? "이미 완료된 미션입니다." : `'${mission.title}' 미션을 완료했습니다! (+100 G)`, "success")}
                  className="flex items-center justify-between p-3 rounded-xl bg-purple-950/40 border border-purple-500/10 hover:border-purple-500/30 transition-all cursor-pointer"
                >
                  <div className="flex items-center gap-3">
                    <div className={`w-5 h-5 rounded-md flex items-center justify-center border ${mission.completed ? 'bg-purple-600 border-purple-500 text-white' : 'border-purple-400/40'}`}>
                      {mission.completed && <Icon name="check" size={14} />}
                    </div>
                    <span className={`text-xs ${mission.completed ? 'line-through text-gray-400' : 'text-gray-200 font-medium'}`}>
                      {mission.title}
                    </span>
                  </div>
                  <span className="text-[11px] text-purple-400 bg-purple-900/30 px-2 py-0.5 rounded">
                    {mission.reward}
                  </span>
                </div>
              ))}
            </div>
          </div>

          <div className="glass-card p-5 border-indigo-500/30 bg-gradient-to-r from-indigo-950/30 to-purple-950/30 relative">
            <div className="flex items-center justify-between mb-2">
              <span className="text-xs font-bold text-indigo-300 flex items-center gap-1.5">
                <Icon name="quote" size={14} />
                오늘의 AI 동기부여 명언
              </span>
              <button
                onClick={handlePlayQuote}
                className={`p-2 rounded-full border transition-all ${
                  isPlayingQuote 
                    ? 'bg-rose-500/20 border-rose-500/50 text-rose-300 animate-pulse' 
                    : 'bg-purple-600/30 border-purple-500/40 text-purple-200 hover:bg-purple-600/50'
                }`}
                title="음성으로 듣기"
              >
                <Icon name={isPlayingQuote ? "square" : "volume-2"} size={16} />
              </button>
            </div>
            <p className="text-xs text-purple-100/90 leading-relaxed italic">
              "{quoteText}"
            </p>
          </div>
        </div>
      );
    };

    // --- Morning Tab ---
    const MorningTab = ({ userStats, setUserStats, showToast }) => {
      const [wakeTime, setWakeTime] = useState(userStats.nextWakeTime || "07:00");
      const [reason, setReason] = useState(userStats.morningReason || "중요한 프로젝트 마감 및 아침 운동");
      const [style, setStyle] = useState("친절");
      const [isLoading, setIsLoading] = useState(false);
      const [aiResult, setAiResult] = useState(null);
      const [isPlayingTts, setIsPlayingTts] = useState(false);

      const styleOptions = [
        { id: "친절", label: "친절한 메이트", icon: "heart", desc: "따뜻하고 상냥하게 아침을 열어줍니다." },
        { id: "일반", label: "표준 비서", icon: "briefcase", desc: "명확하고 정돈된 일정 안내 중심입니다." },
        { id: "친구", label: "장난스런 친구", icon: "smile", desc: "친근하고 재미있게 잠을 깨워줍니다." },
        { id: "교관", label: "스파르타 교관", icon: "shield-alert", desc: "강력하고 엄격하게 바로 일어나게 만듭니다." }
      ];

      const handleGenerateCall = async () => {
        if (!reason.trim()) {
          showToast("기상 이유를 간단히 입력해 주세요.", "warning");
          return;
        }

        setIsLoading(true);
        stopSpeech();
        setIsPlayingTts(false);

        try {
          const response = await fetch("/api/generate", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ wakeTime, reason, style })
          });

          if (!response.ok) {
            throw new Error(`API Error: ${response.status}`);
          }

          const data = await response.json();
          setAiResult(data);
          
          setUserStats(prev => ({
            ...prev,
            nextWakeTime: wakeTime,
            morningReason: reason
          }));

          showToast("Gemini AI 모닝콜이 성공적으로 생성되었습니다!", "success");
        } catch (error) {
          console.error("AI 생성 오차:", error);
          const fallbackData = {
            alarmCall: `[${style} 모닝콜] 안녕하십니까! 설정하신 ${wakeTime}입니다. '${reason}' 목표를 잊지 않으셨죠? 지금 바로 눈을 뜨고 새로운 하루를 시작하십시오!`,
            motivation: `오늘의 아침을 기회로 바꾸는 것은 당신의 행동입니다.`,
            tip: `따뜻한 물 한 잔을 마셔 대사를 활성화하고, 가벼운 스트레칭으로 몸을 깨우세요.`
          };
          setAiResult(fallbackData);
          showToast("서버 연결 보완으로 시뮬레이션 AI 결과를 출력합니다.", "info");
        } finally {
          setIsLoading(false);
        }
      };

      const handleToggleTts = (textToSpeak) => {
        if (isPlayingTts) {
          stopSpeech();
          setIsPlayingTts(false);
        } else {
          setIsPlayingTts(true);
          speakText(textToSpeak, () => setIsPlayingTts(false));
        }
      };

      return (
        <div className="p-5 space-y-6 pb-28 animate-fade-in">
          <div className="space-y-1">
            <h2 className="text-xl font-bold text-purple-100 flex items-center gap-2">
              <Icon name="sun" size={22} className="text-amber-400" />
              맞춤형 AI 모닝콜 설정
            </h2>
            <p className="text-xs text-gray-400">Gemini AI가 당신의 기상 목적에 맞춘 전용 메시지를 생성합니다.</p>
          </div>

          <div className="glass-card p-5 space-y-4">
            <div>
              <label className="block text-xs font-semibold text-purple-300 mb-2">목표 기상 시간</label>
              <input
                type="time"
                value={wakeTime}
                onChange={(e) => setWakeTime(e.target.value)}
                className="w-full bg-purple-950/60 border border-purple-500/30 rounded-xl px-4 py-3 text-white text-lg font-mono focus:outline-none focus:border-purple-400"
              />
            </div>

            <div>
              <label className="block text-xs font-semibold text-purple-300 mb-2">기상 이유 / 오늘 목표</label>
              <textarea
                rows="2"
                value={reason}
                onChange={(e) => setReason(e.target.value)}

    // --- Community Tab ---

          avatarBg: 'from-purple-500 to-indigo-600',

      useEffect(() => {

        try {
          if (db && db.collection) {
            unsubscribe = db.collection('posts')
              .orderBy('createdAt', 'desc')
              .limit(20)
              .onSnapshot((snapshot) => {
                const fetched = snapshot.docs.map(doc => ({
                  id: doc.id,
                  ...doc.data(),
                  createdAt: doc.data().createdAt ? new Date(doc.data().createdAt.seconds * 1000).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '방금 전'

          console.warn("Firestore 연동 준비 중");

        return () => unsubscribe();
      }, []);

      const handleCreatePost = async (e) => {
        e.preventDefault();

          commentsCount: 0,
          createdAt: new Date().toISOString()

        try {
          if (db && db.collection) {
            await db.collection('posts').add({
              ...newPostData,
              createdAt: firebase.firestore.FieldValue.serverTimestamp()

          } else {
            setPosts([ { id: Date.now().toString(), ...newPostData, createdAt: '방금 전' }, ...posts ]);

          setIsModalOpen(false);

      const handleLike = (postId, e) => {
        e.stopPropagation();
        setPosts(prev => prev.map(p => {
          if (p.id === postId) {
            return { ...p, likes: p.likes + 1 };
          }
          return p;
        }));
        showToast("좋아요를 눌렀습니다!", "info");
      };

      const handleAddComment = (postId) => {
        if (!commentText.trim()) return;
        const newCmt = {
          id: Date.now(),
          nickname: userStats.nickname,
          text: commentText,
          time: '방금 전'
        };
        setComments(prev => ({
          ...prev,
          [postId]: [...(prev[postId] || []), newCmt]
        }));
        setPosts(prev => prev.map(p => p.id === postId ? { ...p, commentsCount: p.commentsCount + 1 } : p));
        setCommentText('');
        showToast("댓글이 응원과 함께 등록되었습니다.", "success");
      };

      const filteredPosts = activeCategory === 'all' 
        ? posts 
        : posts.filter(p => p.category === activeCategory);

      return (
        <div className="p-5 space-y-5 pb-28 animate-fade-in">

            <div>
              <h2 className="text-xl font-bold text-purple-100 flex items-center gap-2">
                <Icon name="users" size={22} className="text-purple-400" />
                반익명 커뮤니티
              </h2>
              <p className="text-xs text-gray-400">서로의 아침 기상을 인증하고 응원을 나누세요.</p>

                key={cat.id}

                  activeCategory === cat.id
                    ? 'bg-purple-600 border-purple-400 text-white shadow-md shadow-purple-600/20'
                    : 'bg-purple-950/40 border-purple-500/20 text-gray-400 hover:text-purple-200'

              >
                {cat.label}
              </button>
            ))}
          </div>

          <div className="space-y-3">
            {filteredPosts.map(post => (
              <div

                <div className="flex items-center justify-between mb-2">
                  <div className="flex items-center gap-2.5">
                    <div className={`w-8 h-8 rounded-full bg-gradient-to-br ${post.avatarBg || 'from-purple-500 to-indigo-500'} flex items-center justify-center text-xs font-bold text-white shadow-md`}>
                      {post.nickname ? post.nickname.charAt(0) : '익'}
                    </div>
                    <div>
                      <span className="text-xs font-bold text-purple-200 block">{post.nickname}</span>
                      <span className="text-[10px] text-gray-400">{post.createdAt} · 목표 {post.wakeTime}</span>
                    </div>
                  </div>
                  <span className={`text-[10px] px-2 py-0.5 rounded-md font-semibold border ${
                    post.category === 'verify' ? 'bg-amber-950/40 border-amber-500/30 text-amber-300' :
                    post.category === 'reason' ? 'bg-indigo-950/40 border-indigo-500/30 text-indigo-300' :
                    'bg-purple-950/40 border-purple-500/30 text-purple-300'
                  }`}>
                    {post.category === 'verify' ? '인증' : post.category === 'reason' ? '목표' : '자유'}
                  </span>
                </div>

                <h3 className="text-sm font-bold text-white mb-1">{post.title}</h3>
                <p className="text-xs text-gray-300 line-clamp-2 leading-relaxed mb-3">{post.content}</p>

                <div className="flex items-center justify-between pt-2 border-t border-purple-500/10 text-xs text-gray-400">
                  <div className="flex items-center gap-4">
                    <button
                      onClick={(e) => handleLike(post.id, e)}
                      className="flex items-center gap-1 hover:text-rose-400 transition-colors"
                    >
                      <Icon name="heart" size={14} className="text-rose-400" />
                      <span>{post.likes}</span>
                    </button>
                    <div className="flex items-center gap-1">
                      <Icon name="message-square" size={14} className="text-purple-400" />

                            <span>{c.nickname}</span>

                      <input

                        value={commentText}
                        onChange={e => setCommentText(e.target.value)}
                        onKeyDown={e => e.key === 'Enter' && handleAddComment(post.id)}

                      <button
                        onClick={() => handleAddComment(post.id)}
                        className="bg-purple-600 hover:bg-purple-500 text-white px-3 py-1.5 rounded-lg text-xs font-bold"
                      >
                        등록
                      </button>
                    </div>
                  </div>
                )}
              </div>
            ))}
          </div>

          {isModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 animate-fade-in">
              <div className="glass-card w-full max-w-[400px] p-5 space-y-4 border-purple-500/40 bg-purple-950/90">
                <div className="flex justify-between items-center border-b border-purple-500/20 pb-3">
                  <h3 className="font-bold text-sm text-purple-100 flex items-center gap-1.5">

                    <Icon name="x" size={18} />

                  <div>
                    <label className="block text-xs font-medium text-purple-300 mb-1">카테고리</label>
                    <select
                      value={newCategory}
                      onChange={e => setNewCategory(e.target.value)}
                      className="w-full bg-purple-900/60 border border-purple-500/30 rounded-xl p-2.5 text-xs text-white focus:outline-none"

                    <button

                    >

                    <button
                      type="submit"
                      className="flex-1 py-2.5 rounded-xl bg-purple-600 hover:bg-purple-500 text-white font-bold text-xs shadow-lg shadow-purple-600/30"
                    >
                      게시하기
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

      );
    };

    // --- Shop Tab ---

      const shopCategories = [
        { id: 'border', label: '프로필 테두리' },

        { id: 'color', label: '닉네임 색상' }
      ];

      const shopItems = [
        {
          id: 'item-border-1',
          category: 'border',
          name: '네온 퍼플 링',
          price: 500,
          desc: '영롱하게 빛나는 보라색 하이라이트 테두리',
          value: 'border-purple-400 shadow-[0_0_15px_rgba(168,85,247,0.5)]',
          icon: 'sparkles'
        },
        {
          id: 'item-border-2',
          category: 'border',
          name: '골드 크라운 링',
          price: 1000,
          desc: '골드빛 광채가 도는 프리미엄 테두리',
          value: 'border-amber-400 shadow-[0_0_15px_rgba(251,191,36,0.6)]',
          icon: 'crown'
        },
        {
          id: 'item-bg-1',
          category: 'bg',
          name: '오로라 드림',
          price: 800,
          desc: '신비로운 에메랄드와 보랏빛의 조합',
          value: 'from-teal-500 via-indigo-600 to-purple-700',
          icon: 'palette'
        },
        {
          id: 'item-bg-2',
          category: 'bg',
          name: '선라이즈 골드',
          price: 1200,
          desc: '희망찬 아침 햇살을 닮은 그래디언트',
          value: 'from-amber-500 via-rose-500 to-purple-600',
          icon: 'sun'
        },
        {
          id: 'item-color-1',
          category: 'color',
          name: '황금빛 닉네임',
          price: 600,
          desc: '닉네임을 황금색으로 강조합니다.',
          value: 'text-amber-300 font-extrabold',
          icon: 'type'
        },
        {
          id: 'item-color-2',
          category: 'color',
          name: '네온 민트 닉네임',
          price: 600,
          desc: '청량한 민트 빛깔로 닉네임을 변경합니다.',
          value: 'text-emerald-300 font-extrabold',
          icon: 'type'
        }
      ];

      const handleBuyOrEquip = (item) => {
        const isOwned = userStats.inventory.includes(item.id);

        if (isOwned) {
          setUserStats(prev => ({
            ...prev,
            equippedBorder: item.category === 'border' ? item.value : prev.equippedBorder,
            avatarBg: item.category === 'bg' ? item.value : prev.avatarBg,
            nicknameColor: item.category === 'color' ? item.value : prev.nicknameColor
          }));
          showToast(`'${item.name}' 아이템을 착용했습니다!`, "success");
        } else {
          if (userStats.currency < item.price) {
            showToast("보유한 재화(G)가 부족합니다.", "error");
            return;
          }

          setUserStats(prev => ({
            ...prev,
            currency: prev.currency - item.price,
            inventory: [...prev.inventory, item.id],
            equippedBorder: item.category === 'border' ? item.value : prev.equippedBorder,
            avatarBg: item.category === 'bg' ? item.value : prev.avatarBg,
            nicknameColor: item.category === 'color' ? item.value : prev.nicknameColor
          }));
          showToast(`'${item.name}' 구매 및 자동 착용 완료!`, "success");

            <div className="flex items-center gap-2">
              <Icon name="coins" size={20} className="text-amber-400" />
              <span className="text-xl font-black text-amber-300 font-mono">{userStats.currency.toLocaleString()} G</span>
            </div>
          </div>

          <div className="grid grid-cols-3 gap-2">
            {shopCategories.map(cat => (
              <button
                key={cat.id}
                onClick={() => setSelectedCategory(cat.id)}
                className={`py-2 rounded-xl text-xs font-bold transition-all border ${
                  selectedCategory === cat.id
                    ? 'bg-purple-600 border-purple-400 text-white shadow-lg shadow-purple-600/30'
                    : 'bg-purple-950/40 border-purple-500/20 text-gray-400 hover:text-purple-200'
                }`}
              >
                {cat.label}
              </button>
            ))}
          </div>

          <div className="grid grid-cols-1 gap-3">
            {filteredItems.map(item => {
              const isOwned = userStats.inventory.includes(item.id);
              const isEquipped = 
                (item.category === 'border' && userStats.equippedBorder === item.value) ||
                (item.category === 'bg' && userStats.avatarBg === item.value) ||
                (item.category === 'color' && userStats.nicknameColor === item.value);

              return (
                <div key={item.id} className="glass-card p-4 flex items-center justify-between border-purple-500/20 hover:border-purple-500/40">
                  <div className="flex items-center gap-3">
                    <div className="w-12 h-12 rounded-xl bg-purple-950 border border-purple-500/30 flex items-center justify-center text-purple-300">
                      <Icon name={item.icon} size={22} />
                    </div>
                    <div>
                      <h4 className="text-sm font-bold text-white flex items-center gap-1.5">
                        {item.name}
                        {isEquipped && (
                          <span className="text-[10px] bg-purple-500 text-white px-2 py-0.2 rounded-full font-semibold">착용중</span>
                        )}
                      </h4>
                      <p className="text-[11px] text-gray-400 line-clamp-1">{item.desc}</p>
                      <span className="text-xs font-bold text-amber-300 font-mono">{item.price} G</span>
                    </div>
                  </div>

                  <button
                    onClick={() => handleBuyOrEquip(item)}
                    className={`px-3.5 py-2 rounded-xl text-xs font-bold transition-all ${
                      isEquipped
                        ? 'bg-purple-900/40 border border-purple-500/30 text-purple-300 cursor-default'
                        : isOwned
                        ? 'bg-indigo-600 hover:bg-indigo-500 text-white shadow-md'
                        : 'bg-amber-600 hover:bg-amber-500 text-white shadow-md shadow-amber-600/20'
                    }`}
                  >
                    {isEquipped ? '장착됨' : isOwned ? '착용하기' : '구매하기'}
                  </button>
                </div>
              );
            })}
          </div>
        </div>
      );
    };

    // --- Profile Tab ---
    const ProfileTab = ({ userStats, setUserStats, showToast }) => {
      const handleClaimAchievement = (achId, reward) => {
        setUserStats(prev => ({
          ...prev,
          currency: prev.currency + reward,
          achievements: prev.achievements.map(a => a.id === achId ? { ...a, claimed: true } : a)
        }));
        showToast(`업적 보상 +${reward} G 수령 완료!`, "success");
      };

      const expPercentage = Math.min(100, Math.round((userStats.exp / userStats.maxExp) * 100));

      return (
        <div className="p-5 space-y-6 pb-28 animate-fade-in">
          <div>
            <h2 className="text-xl font-bold text-purple-100 flex items-center gap-2">
              <Icon name="user" size={22} className="text-purple-400" />
              마이 프로필
            </h2>
            <p className="text-xs text-gray-400">당신의 아침 성장 기록과 달성 업적을 한눈에 확인하세요.</p>
          </div>

          <div className="glass-card p-6 border-purple-500/30 text-center relative overflow-hidden bg-gradient-to-b from-purple-900/30 to-purple-950/60">
            <div className="flex flex-col items-center">
              <div className={`w-20 h-20 rounded-full bg-gradient-to-tr ${userStats.avatarBg || 'from-purple-500 to-indigo-600'} flex items-center justify-center text-2xl font-black text-white border-2 ${userStats.equippedBorder || 'border-purple-400/30'} shadow-2xl mb-3`}>
                {userStats.nickname ? userStats.nickname.charAt(0) : 'A'}
              </div>

              <h3 className={`text-lg font-extrabold ${userStats.nicknameColor || 'text-white'}`}>
                {userStats.nickname}
              </h3>
              <span className="text-xs text-purple-300/80 font-medium mt-0.5">성실한 모닝 루티너</span>

              <div className="w-full max-w-[240px] mt-4 space-y-1">
                <div className="flex justify-between text-[11px] text-purple-300 font-semibold">
                  <span>Lv.{userStats.level}</span>
                  <span>{userStats.exp} / {userStats.maxExp} EXP</span>
                </div>
                <div className="w-full bg-purple-950 rounded-full h-2.5 border border-purple-500/20 overflow-hidden">
                  <div
                    className="bg-gradient-to-r from-purple-500 to-indigo-400 h-full rounded-full transition-all duration-500"
                    style={{ width: `${expPercentage}%` }}
                  ></div>
                </div>
              </div>
            </div>

            <div className="grid grid-cols-3 gap-2 mt-6 pt-5 border-t border-purple-500/20">
              <div>
                <span className="text-[10px] text-gray-400 block">연속 기상</span>
                <span className="text-base font-extrabold text-amber-400 font-mono">{userStats.streak}일</span>
              </div>
              <div>
                <span className="text-[10px] text-gray-400 block">매너 평점</span>
                <span className="text-base font-extrabold text-purple-300 font-mono">4.9 / 5.0</span>
              </div>
              <div>
                <span className="text-[10px] text-gray-400 block">보유 재화</span>
                <span className="text-base font-extrabold text-amber-300 font-mono">{userStats.currency} G</span>
              </div>
            </div>
          </div>

          <div className="space-y-3">
            <h3 className="text-sm font-bold text-purple-200 flex items-center gap-2">
              <Icon name="award" size={16} className="text-amber-400" />
              업적 및 도전 과제
            </h3>

            <div className="space-y-2.5">
              {userStats.achievements.map((ach) => (
                <div key={ach.id} className="glass-card p-4 flex items-center justify-between border-purple-500/20">
                  <div className="space-y-0.5">
                    <h4 className="text-xs font-bold text-white flex items-center gap-1.5">
                      {ach.title}
                      {ach.completed && <span className="text-[10px] text-emerald-400">✓ 달성</span>}
                    </h4>
                    <p className="text-[11px] text-gray-400">{ach.desc}</p>
                    <span className="text-[10px] text-amber-300 font-semibold font-mono">보상: +{ach.reward} G</span>
                  </div>

                  {ach.completed ? (
                    ach.claimed ? (
                      <span className="text-[11px] text-gray-500 font-medium px-3 py-1.5 rounded-lg bg-purple-950/40">수령완료</span>
                    ) : (
                      <button
                        onClick={() => handleClaimAchievement(ach.id, ach.reward)}
                        className="bg-amber-500 hover:bg-amber-400 text-black font-extrabold text-xs px-3 py-1.5 rounded-xl shadow-lg shadow-amber-500/20 transition-all animate-bounce"
                      >
                        보상 받기
                      </button>
                    )
                  ) : (
                    <span className="text-[11px] text-purple-400 font-medium px-3 py-1.5 rounded-lg bg-purple-950/30">진행 중</span>
                  )}
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    };

    // --- Main App ---
    const App = () => {
      const [activeTab, setActiveTab] = useState('home');
      const [toast, setToast] = useState(null);

      const [userStats, setUserStats] = useState({
        nickname: '새벽의지킴이',
        level: 3,
        exp: 280,
        maxExp: 500,
        streak: 5,
        currency: 1450,
        nextWakeTime: '06:30',
        morningReason: '기말고사 전공 시험 공부 및 운동',
        avatarBg: 'from-purple-500 to-indigo-600',
        nicknameColor: 'text-purple-100',
        equippedBorder: 'border-purple-500/30',
        inventory: ['item-border-1'],
        missions: [
          { id: 1, title: '오전 7시 이전 기상하기', reward: '+50 EXP', completed: true },
          { id: 2, title: 'AI 모닝콜 생성해보기', reward: '+100 G', completed: false },
          { id: 3, title: '커뮤니티에 기상 인증글 올리기', reward: '+100 G', completed: false }
        ],
        achievements: [
          { id: 'ach-1', title: '얼리버드의 시작', desc: '첫 번째 AI 모닝콜 설정 완료하기', reward: 300, completed: true, claimed: true },
          { id: 'ach-2', title: '작심삼일 탈출', desc: '3일 연속 기상 스트릭 달성', reward: 500, completed: true, claimed: false },
          { id: 'ach-3', title: '모닝 인사이드', desc: '커뮤니티 글 3개 작성하기', reward: 400, completed: false, claimed: false }
        ]
      });

      const showToast = useCallback((message, type = "info") => {
        setToast({ message, type });
      }, []);

      const closeToast = useCallback(() => {
        setToast(null);
      }, []);

      return (
        <div className="w-full min-h-screen flex flex-col justify-between relative overflow-hidden">
          {toast && (
            <Toast
              message={toast.message}
              type={toast.type}
              onClose={closeToast}
            />
          )}

          <Header userStats={userStats} />

          <main className="flex-1 overflow-y-auto">
            {activeTab === 'home' && (
              <HomeTab
                userStats={userStats}
                onNavigateMorning={() => setActiveTab('morning')}
                showToast={showToast}
              />
            )}
            {activeTab === 'community' && (
              <CommunityTab
                userStats={userStats}
                showToast={showToast}
              />
            )}
            {activeTab === 'morning' && (
              <MorningTab
                userStats={userStats}
                setUserStats={setUserStats}
                showToast={showToast}
              />
            )}
            {activeTab === 'shop' && (
              <ShopTab
                userStats={userStats}
                setUserStats={setUserStats}
                showToast={showToast}
              />
            )}
            {activeTab === 'profile' && (
              <ProfileTab
                userStats={userStats}
                setUserStats={setUserStats}
                showToast={showToast}
              />
            )}
          </main>

          <BottomNav activeTab={activeTab} setActiveTab={setActiveTab} />
        </div>
      );
    };

    const rootElement = document.getElementById('root');
    if (rootElement) {
      const root = ReactDOM.createRoot(rootElement);
      root.render(<App />);
    }
  </script>
</body>
</html>
